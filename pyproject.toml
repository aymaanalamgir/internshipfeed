[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "internshipfeed"
version = "0.1.0"
description = "Source-aware internship ingestion and job-description enrichment"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<0.129",
    "uvicorn>=0.30,<0.40",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic>=2.9,<3",
    "python-dotenv>=1,<2",
    "pdfplumber>=0.11.8,<0.12",
    "python-multipart>=0.0.20,<0.1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<0.29"]
local-postgres = ["pgserver==0.1.4"]
browser = ["playwright>=1.48,<2"]

[project.scripts]
internshipfeed = "internshipfeed.cli:main"

[tool.setuptools.packages.find]
include = ["internshipfeed*"]

[tool.setuptools.package-data]
internshipfeed = ["migrations/*.sql"]
