# Run persistent local PostgreSQL with a loopback-only port and health check.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: internshipfeed
      POSTGRES_PASSWORD: internshipfeed
      POSTGRES_DB: internshipfeed
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internshipfeed -d internshipfeed"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
